name: 设备适配报告
description: 报告一台新机型上的实测结果（成功或失败都欢迎），用于扩展兼容性表
title: "[适配] <电视型号> - <Android 版本>"
labels: ["device-report"]
body:
  - type: markdown
    attributes:
      value: |
        感谢实测。**每一项都请填**，尤其是 `dumpsys tv_input` 的输出和芯片平台——大部分「切不了信源」的问题都源于平台判断错误。

        填写前请先跑一次侦察脚本，它的输出可以直接贴进下面的字段：

        ```powershell
        powershell -ExecutionPolicy Bypass -File .\scripts\inspect-device.ps1 -TvIp <电视IP>
        ```

  - type: input
    id: model
    attributes:
      label: 电视型号
      description: 完整型号，含尺寸。机身背面标签或「设置 → 关于」里可查
      placeholder: 小米电视4A 55英寸
    validations:
      required: true

  - type: input
    id: android
    attributes:
      label: Android 版本 / API Level
      description: 来自 `getprop ro.build.version.sdk`
      placeholder: Android 6.0.1 / API 23
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 芯片平台
      description: 用 `adb shell pm list packages | findstr /i "droidlogic mediatek wwtv"` 判断。**不要按型号猜**
      options:
        - Amlogic（存在 com.droidlogic.tvinput）
        - MediaTek（存在 com.mediatek.wwtv.tvcenter）
        - 其他 / 未确定
    validations:
      required: true

  - type: dropdown
    id: buildtype
    attributes:
      label: ro.build.type
      description: 决定 `pm disable-user` 是否可用。`user` 表示全部被拒，必须走白名单路线
      options:
        - user（pm 状态变更全部被拒）
        - userdebug
        - eng
    validations:
      required: true

  - type: dropdown
    id: root
    attributes:
      label: 是否有 root / su
      options:
        - 无（/system/xbin/su 不存在）
        - 有 su
        - 未检测
    validations:
      required: true

  - type: dropdown
    id: home
    attributes:
      label: HOME 键接管结果
      options:
        - 成功，且重启后仍生效
        - 成功，但重启后失效
        - 弹出选择框，但选「始终」后仍回到原桌面
        - 完全没弹选择框
        - 未尝试
    validations:
      required: true

  - type: input
    id: whitelist
    attributes:
      label: 生效的白名单包名
      description: 如果接管成功，填你编译时用的 `-PlauncherApplicationId` 值；失败则填试过的
      placeholder: com.ts.launcher

  - type: textarea
    id: tvinput
    attributes:
      label: dumpsys tv_input 的 tuner 行
      description: 只贴含 `HW` 或 `InputService` 的行即可，**请先删掉 MAC 地址、序列号**
      render: shell
      placeholder: |
        TvInputInfo{... HW0 ...} Hdmi1InputService
        TvInputInfo{... HW10 ...} Hdmi2InputService
        TvInputInfo{... HW7 ...} Hdmi3InputService
    validations:
      required: true

  - type: textarea
    id: inputs
    attributes:
      label: 各信源的实际切换情况
      description: 勾选思路：标出哪个端口能用、哪个不行。已知参考映射见下
      value: |
        HDMI 1 (input=23)：可用 / 不可用
        HDMI 2 (input=24)：可用 / 不可用
        HDMI 3 (input=25)：可用 / 不可用 （常见坑：HW7 未注册，必须走厂商编号）
        AV     (input=2) ：可用 / 不可用
        DTMB            ：可用 / 不可用
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 其他发现
      description: 踩到的坑、与 README 描述不符的地方、额外的厂商 action（如果是新发现的，这条最有价值）
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已删除日志中的 MAC 地址、序列号、android_id 等设备标识
          required: true
        - label: 已确认未对系统分区做任何修改
          required: true
